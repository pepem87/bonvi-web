<!doctype html><html lang="es-AR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Vista previa completa | BON VI MERCAT</title><style>:root{--green:#173d31}*{box-sizing:border-box}body{margin:0;background:#f5f0e6;color:var(--green);font:15px system-ui}header{background:var(--green);color:white;padding:20px;text-align:center;font:700 25px Georgia,serif;letter-spacing:2px}main{max-width:900px;margin:auto;padding:16px}h1{font:700 29px Georgia,serif}input{width:100%;padding:15px;border:1px solid #b9b7aa;border-radius:12px;font-size:17px}#results{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:18px}.card{display:flex;align-items:center;gap:12px;background:#fffdf8;border:1px solid #ddd5c7;border-radius:15px;padding:12px;min-width:0}.photo{width:86px;height:108px;flex:0 0 86px;background:#f0ecdf;border-radius:9px;display:grid;place-items:center;text-align:center;font:11px Georgia,serif;color:#738074}.body{min-width:0;overflow-wrap:anywhere}.meta{color:#68786d;font-size:12px}.name{font:700 17px Georgia,serif;margin:7px 0}.price{font:700 25px Georgia,serif;margin:6px 0 0}button{background:var(--green);color:white;border:0;border-radius:22px;padding:12px 22px;font-size:15px;margin:18px 0;cursor:pointer}button:disabled{opacity:.4}@media(max-width:700px){#results{grid-template-columns:1fr}}.note{font-size:12px;color:#657369}</style></head><body><header>BON VI MERCAT</header><main><h1>Catálogo completo · vista privada</h1><p>Buscá por producto o código. Precios para personas según los datos cargados de Supabase.</p><input id="q" type="search" placeholder="Buscar producto o código..." aria-label="Buscar productos"><p id="status">Cargando los 1.541 productos...</p><section id="results"></section><button id="more" hidden>Ver más productos</button><p class="note">Imágenes pendientes de verificación. No es la versión publicada ni sustituye el catálogo original de Streamlit.</p></main><script>const files=Array.from({length:16},(_,i)=>'datos/catalogo-'+String(i+1).padStart(2,'0')+'.json');let products=[],filtered=[],shown=0;const $=x=>document.getElementById(x);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>'$ '+Math.round(Number(n)).toLocaleString('es-AR');const norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();function append(){const part=filtered.slice(shown,shown+40);$('results').insertAdjacentHTML('beforeend',part.map(p=>{const unit=Number(p.precio_persona_unit),b=p.modalidad==='BULTO',n=b?Number(p.uxb)||1:1;return '<article class="card"><div class="photo">BON VI MERCAT<br>Imagen pendiente</div><div class="body"><div class="meta">Cód. '+esc(p.codigo)+'</div><div class="name">'+esc(p.producto)+'</div><div class="meta">'+(b?'Venta por bulto · '+n+' unidades':'Venta por unidad')+'</div><div class="price">'+money(unit*n)+'</div>'+(b?'<div class="meta">'+money(unit)+' por unidad</div>':'')+'</div></article>'}).join(''));shown+=part.length;$('more').hidden=shown>=filtered.length;$('status').textContent=filtered.length+' productos encontrados'+(shown<filtered.length?' · mostrando '+shown:'')}function render(){const q=norm($('q').value);filtered=products.filter(p=>!q||norm(p.producto+' '+p.codigo+' '+p.familia).includes(q));shown=0;$('results').innerHTML='';append()}$('q').addEventListener('input',render);$('more').addEventListener('click',append);Promise.all(files.map(f=>fetch(f).then(r=>{if(!r.ok)throw Error(f+' '+r.status);return r.json()}))).then(arr=>{products=arr.flat();if(products.length!==1541)throw Error('Se esperaban 1541 productos; se recibieron '+products.length);if(new Set(products.map(p=>String(p.codigo))).size!==1541)throw Error('Códigos duplicados');render()}).catch(e=>{$('status').textContent='No se pudo cargar la vista previa: '+e.message})</script></body></html>
