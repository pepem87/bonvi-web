name: Publicar L7 aprobada inmediatamente
on:
  repository_dispatch:
    types: [bonvi-l7-aprobada]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: bonvi-web-l7-publication
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-latest
    env:
      BONVI_GITHUB_WEB_TOKEN: ${{ secrets.BONVI_GITHUB_WEB_TOKEN }}
      BONVI_SUPABASE_URL: ${{ secrets.BONVI_SUPABASE_URL }}
      BONVI_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.BONVI_SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Checkout de la web pública
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          # El mismo token fine-grained que inicia repository_dispatch.
          # Con GITHUB_TOKEN los pushes NO disparan GitHub Pages.
          token: ${{ secrets.BONVI_GITHUB_WEB_TOKEN }}
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Instalar dependencias fijadas
        run: python -m pip install -r scripts/catalog-requirements.txt
      - name: Verificar secrets de sincronización
        run: |
          test -n "$BONVI_GITHUB_WEB_TOKEN" || (echo 'Falta BONVI_GITHUB_WEB_TOKEN' && exit 1)
          test -n "$BONVI_SUPABASE_URL" || (echo 'Falta BONVI_SUPABASE_URL en secrets' && exit 1)
          test -n "$BONVI_SUPABASE_SERVICE_ROLE_KEY" || (echo 'Falta BONVI_SUPABASE_SERVICE_ROLE_KEY en secrets' && exit 1)
      - name: Leer exclusivamente datos públicos de la L7 aprobada
        id: export
        env:
          EVENT_L7_ID: ${{ github.event.client_payload.l7_id || '0' }}
        run: |
          python scripts/fetch_approved_snapshot.py \
            --snapshot "$RUNNER_TEMP/catalogo_snapshot.json" \
            --fingerprint "$RUNNER_TEMP/catalogo_fingerprint.json" \
            --expected-id "$EVENT_L7_ID" \
            --existing-marker catalogo/version-l7.json
      - name: Generar catálogo y PDF en el checkout
        if: steps.export.outputs.update == 'true'
        run: |
          PYTHONDONTWRITEBYTECODE=1 python scripts/sync_catalog.py \
            --root . \
            --snapshot "$RUNNER_TEMP/catalogo_snapshot.json" \
            --report "$RUNNER_TEMP/catalogo_report.json"
      - name: Verificar alcance del cambio y revalidar datos
        if: steps.export.outputs.update == 'true'
        env:
          EVENT_L7_ID: ${{ github.event.client_payload.l7_id || '0' }}
        run: |
          python scripts/fetch_approved_snapshot.py \
            --snapshot "$RUNNER_TEMP/catalogo_snapshot.json" \
            --fingerprint "$RUNNER_TEMP/catalogo_fingerprint.json" \
            --expected-id "$EVENT_L7_ID" \
            --verify
          git add -A -- catalogo sitemap.xml
          git diff --cached --check
          if git diff --cached --name-only | grep -vE '^(catalogo/|sitemap\.xml$)'; then
            echo 'Hay cambios fuera del catálogo público'; exit 1
          fi
          # Nunca publicar scripts ni snapshots temporales.
          if git status --porcelain --untracked-files=all | grep -E '\.json\.tmp|snapshot\.json'; then
            echo 'Snapshot temporal en el checkout'; exit 1
          fi
      - name: Publicar un único commit de catálogo en main
        if: steps.export.outputs.update == 'true'
        run: |
          if git diff --cached --quiet; then
            echo 'Sin diferencias para publicar'; exit 0
          fi
          git config user.name 'bonvi-catalog-bot'
          git config user.email 'bonvi-catalog-bot@users.noreply.github.com'
          git commit -m "Publicar catálogo L7 aprobada"
          git push origin HEAD:main
      - name: Confirmar propagación al dominio público
        if: steps.export.outputs.update == 'true'
        run: |
          python - <<'PY'
          import json, time
          from pathlib import Path
          from urllib.request import Request, urlopen
          expected = json.loads(Path("catalogo/version-l7.json").read_text())
          url = "https://bonvimercat.com.ar/catalogo/version-l7.json"
          for attempt in range(18):
              try:
                  with urlopen(Request(url+"?version="+str(expected["l7"]),
                                       headers={"Cache-Control":"no-cache"}), timeout=10) as resp:
                      actual=json.loads(resp.read().decode())
                  if (actual.get("l7")==expected["l7"]
                          and actual.get("vigencia")==expected["vigencia"]
                          and actual.get("publicables")==expected["publicables"]):
                      print("Web pública sincronizada con L7 #"+str(expected["l7"]))
                      break
              except Exception:
                  pass
              time.sleep(20)
          else:
              raise SystemExit("La L7 se subió a GitHub pero falta confirmar publicación en dominio.")
          PY
      - name: Resumen de conciliación
        if: steps.export.outputs.update == 'true'
        run: cat "$RUNNER_TEMP/catalogo_report.json" >> "$GITHUB_STEP_SUMMARY"
