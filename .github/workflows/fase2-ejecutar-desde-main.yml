name: BON VI - Fase 2 - Validar sincronizacion (sin publicar)

on:
  workflow_dispatch:
    inputs:
      prueba_con_supabase:
        description: "Leer Supabase y generar copia privada (requiere secretos configurados)"
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: bonvi-fase2-validacion-privada
  cancel-in-progress: false

jobs:
  comprobar:
    name: Comprobacion sin publicacion
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Descargar desarrollo del catalogo (no main)
        uses: actions/checkout@v4
        with:
          ref: 76dac798744eeac69133d268228f6fb8402f4099 # version de desarrollo fijada; no ejecutar código que cambie silenciosamente
          persist-credentials: false

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Probar generadores y validadores
        run: python -m unittest discover -s tools -p 'test_*.py' -v

      - name: Comprobar snapshot de referencia
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path('tools').resolve()))
          from validar_catalogo_completo import load_archived_rows
          rows = load_archived_rows(Path('preview/datos'))
          print('SKU verificados contra referencia:', len(rows))
          PY

      - name: Verificar que existen secretos de lectura (nunca imprimir valores)
        if: ${{ inputs.prueba_con_supabase }}
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.BONVI_PRIVATE_REPO_READ_TOKEN }}
          READONLY_DATABASE_URL: ${{ secrets.BONVI_CATALOG_READONLY_DATABASE_URL }}
        shell: bash
        run: |
          if [ -z "$PRIVATE_REPO_TOKEN" ] || [ -z "$READONLY_DATABASE_URL" ]; then
            echo "::error::Faltan secretos de acceso de solo lectura en GitHub Actions."
            exit 1
          fi

      - name: Descargar reglas Streamlit en solo lectura
        if: ${{ inputs.prueba_con_supabase }}
        uses: actions/checkout@v4
        with:
          repository: pepem87/Bonvi-Mercat
          ref: main
          token: ${{ secrets.BONVI_PRIVATE_REPO_READ_TOKEN }}
          path: original
          persist-credentials: false

      - name: Instalar dependencias de generacion privada
        if: ${{ inputs.prueba_con_supabase }}
        run: python -m pip install --disable-pip-version-check psycopg2-binary reportlab pillow

      - name: Generar referencia del 06-11 offline
        if: ${{ inputs.prueba_con_supabase }}
        env:
          WORKDIR: ${{ runner.temp }}
        run: |
          python tools/validar_catalogo_completo.py \
            --streamlit-dir "$GITHUB_WORKSPACE/original/BON_VI_MERCAT_Proyecto_v7_3_ONLINE/BON_VI_MERCAT_REAL_v7_3_ONLINE" \
            --output "$WORKDIR/bonvi-base-aprobada"

      - name: Generar version vigente desde Supabase en modo de solo lectura
        if: ${{ inputs.prueba_con_supabase }}
        env:
          DATABASE_URL: ${{ secrets.BONVI_CATALOG_READONLY_DATABASE_URL }}
          WORKDIR: ${{ runner.temp }}
        run: |
          python tools/generar_catalogo_integrado.py \
            --streamlit-dir "$GITHUB_WORKSPACE/original/BON_VI_MERCAT_Proyecto_v7_3_ONLINE/BON_VI_MERCAT_REAL_v7_3_ONLINE" \
            --output "$WORKDIR/bonvi-catalogo-nuevo"

      - name: Comparar version aprobada con Supabase
        if: ${{ inputs.prueba_con_supabase }}
        env:
          WORKDIR: ${{ runner.temp }}
        run: |
          python tools/validar_sincronizacion.py \
            --aprobado "$WORKDIR/bonvi-base-aprobada/index.html" \
            --nuevo "$WORKDIR/bonvi-catalogo-nuevo/index.html" \
            --reporte "$WORKDIR/bonvi-control-sincronizacion.json"

      - name: Recordatorio de seguridad
        if: ${{ always() }}
        run: echo "Solo verificacion. No hay despliegue, git push, modificacion SQL ni publicacion de artefactos."
